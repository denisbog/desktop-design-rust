[package]
name = "printcraft-design-demo"
description = "A minimal, runnable Rust port of the PrintCraft PDF-workbench design demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

# The same dependency set as PrintCraft's egui shell (crates/ui-egui + apps/printcraft):
# egui 0.36 for the widgets, egui_extras for the SVG image loader, eframe for the shell,
# rfd for native file dialogs, serde/serde_json for persisted state, log for diagnostics.
[dependencies]
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "accesskit",
    "wayland",
    "x11",
    "persistence",
    "links",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rfd = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
